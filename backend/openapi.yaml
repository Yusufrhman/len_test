openapi: 3.0.3
info:
  title: Len Backend API
  description: |
    Geographical entity management API built with Go, Gin, sqlx, and PostgreSQL.

    All successful responses are wrapped in a `data` envelope. All errors use a
    single `error` envelope. See `api-contract.md` for the full contract.

    Notes on behavior derived from the implementation:

    - `type` is validated server-side against `vehicle`, `iot_device`, and `facility`.
    - `status` is required but its value is not constrained by the backend.
      Seed data uses `active`, `inactive`, and `maintenance`.
    - A malformed or unknown entity identifier on detail/update/delete returns
      `404` with code `ENTITY_NOT_FOUND` (invalid UUIDs are mapped to not found).
  version: 1.0.0
  contact:
    name: Len Backend
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
security: []
tags:
  - name: Entities
    description: Operations on geographical entities

paths:
  /entities:
    get:
      tags: [Entities]
      operationId: getEntities
      summary: List entities
      description: |
        Retrieve entities to display on the map, optionally filtered by `type`
        and `status`. Results are ordered by `createdAt` descending.
      parameters:
        - name: type
          in: query
          required: false
          description: Filter entities by type.
          schema:
            type: string
            enum: [vehicle, iot_device, facility]
          example: vehicle
        - name: status
          in: query
          required: false
          description: Filter entities by status.
          schema:
            type: string
          example: active
      responses:
        "200":
          description: A list of entities. The array may be empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityListResponse"
              example:
                data:
                  - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    name: Vehicle 001
                    type: vehicle
                    status: active
                    latitude: -7.2575
                    longitude: 112.7521
                    createdAt: "2026-09-18T08:00:00Z"
                    updatedAt: "2026-09-18T08:00:00Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [Entities]
      operationId: createEntity
      summary: Create entity
      description: Create a new entity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityRequest"
            example:
              name: Vehicle 001
              type: vehicle
              status: active
              latitude: -7.2575
              longitude: 112.7521
      responses:
        "201":
          description: Entity successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityResponse"
              example:
                data:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  name: Vehicle 001
                  type: vehicle
                  status: active
                  latitude: -7.2575
                  longitude: 112.7521
                  createdAt: "2026-09-18T08:00:00Z"
                  updatedAt: "2026-09-18T08:00:00Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /entities/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Entity identifier (UUID). Malformed identifiers are treated as not found.
        schema:
          type: string
          format: uuid
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    get:
      tags: [Entities]
      operationId: getEntity
      summary: Get entity detail
      description: Retrieve the details of a specific entity.
      responses:
        "200":
          description: The requested entity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityResponse"
              example:
                data:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  name: Vehicle 001
                  type: vehicle
                  status: active
                  latitude: -7.2575
                  longitude: 112.7521
                  createdAt: "2026-09-18T08:00:00Z"
                  updatedAt: "2026-09-18T08:00:00Z"
        "404":
          $ref: "#/components/responses/EntityNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Entities]
      operationId: updateEntity
      summary: Update entity
      description: Update an existing entity. All fields are required (full replacement).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityRequest"
            example:
              name: Vehicle 001 Updated
              type: vehicle
              status: inactive
              latitude: -7.258
              longitude: 112.753
      responses:
        "200":
          description: Entity successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityResponse"
              example:
                data:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  name: Vehicle 001 Updated
                  type: vehicle
                  status: inactive
                  latitude: -7.258
                  longitude: 112.753
                  createdAt: "2026-09-18T08:00:00Z"
                  updatedAt: "2026-09-18T09:00:00Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/EntityNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Entities]
      operationId: deleteEntity
      summary: Delete entity
      description: Delete an entity.
      responses:
        "204":
          description: Entity successfully deleted. No response body.
        "404":
          $ref: "#/components/responses/EntityNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  responses:
    EntityNotFound:
      description: Entity does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: ENTITY_NOT_FOUND
              message: Entity not found
    ValidationError:
      description: |
        Invalid request data. `fields` is present when field-level validation
        errors exist; malformed JSON produces `VALIDATION_ERROR` without `fields`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid request data
              fields:
                name: name is required
                type: "type must be one of: vehicle, iot_device, facility"
                latitude: latitude must be between -90 and 90
                longitude: longitude must be between -180 and 180
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_SERVER_ERROR
              message: An unexpected error occurred

  schemas:
    Entity:
      type: object
      description: A geographical entity.
      required:
        - id
        - name
        - type
        - status
        - latitude
        - longitude
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique entity identifier.
          readOnly: true
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          description: Entity name.
          maxLength: 255
          example: Vehicle 001
        type:
          type: string
          description: Type of entity.
          enum: [vehicle, iot_device, facility]
          example: vehicle
        status:
          type: string
          description: |
            Current entity status. Not constrained by the backend; common values
            are `active`, `inactive`, and `maintenance`.
          maxLength: 50
          example: active
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Geographic latitude.
          example: -7.2575
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Geographic longitude.
          example: 112.7521
        createdAt:
          type: string
          format: date-time
          description: Entity creation timestamp (UTC).
          readOnly: true
          example: "2026-09-18T08:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Last entity update timestamp (UTC).
          readOnly: true
          example: "2026-09-18T08:00:00Z"

    EntityRequest:
      type: object
      description: Payload for creating or fully updating an entity.
      required:
        - name
        - type
        - status
        - latitude
        - longitude
      properties:
        name:
          type: string
          maxLength: 255
          description: Entity name.
          example: Vehicle 001
        type:
          type: string
          description: Type of entity.
          enum: [vehicle, iot_device, facility]
          example: vehicle
        status:
          type: string
          maxLength: 50
          description: Current entity status.
          example: active
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Geographic latitude.
          example: -7.2575
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Geographic longitude.
          example: 112.7521

    EntityResponse:
      type: object
      description: Single-entity success envelope.
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Entity"

    EntityListResponse:
      type: object
      description: Entity list success envelope.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Entity"

    ErrorResponse:
      type: object
      description: Standard error envelope.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Machine-readable error code. One of `VALIDATION_ERROR`,
                `ENTITY_NOT_FOUND`, `INTERNAL_SERVER_ERROR`.
              enum:
                - VALIDATION_ERROR
                - ENTITY_NOT_FOUND
                - INTERNAL_SERVER_ERROR
              example: ENTITY_NOT_FOUND
            message:
              type: string
              description: Human-readable summary of the error.
              example: Entity not found
            fields:
              type: object
              description: |
                Present only for validation errors with field-level failures.
                Maps field names (JSON naming) to error messages.
              additionalProperties:
                type: string
              example:
                name: name is required
